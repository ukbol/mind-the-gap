name: Run gap-analysis pipelines

on:
  workflow_dispatch:
    inputs:
      pipelines:
        description: 'Comma-separated pipeline names, or "all"'
        required: false
        default: 'all'
      force:
        description: 'Run even if no new Zenodo versions are detected'
        type: boolean
        default: false

  schedule:
    # Daily; the check job no-ops cheaply when nothing changed.
    - cron: '0 6 * * *'

  repository_dispatch:
    types: [zenodo-new-version]

# Only one matrix-fan-out is in flight at a time across the repo so the
# bot's state.json pushes serialise cleanly. New triggers queue.
concurrency:
  group: run-pipelines
  cancel-in-progress: false

permissions:
  contents: write   # bot commit of pipeline/state.json

jobs:
  check:
    name: Check for new Zenodo versions
    runs-on: ubuntu-latest
    outputs:
      pipelines: ${{ steps.diff.outputs.pipelines_to_run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal deps for the checker
        run: pip install pyyaml requests

      - name: Resolve pipelines needing a run
        id: diff
        env:
          INPUT_PIPELINES: ${{ github.event.inputs.pipelines }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          ARGS=()
          if [ -n "${INPUT_PIPELINES:-}" ] && [ "${INPUT_PIPELINES}" != "all" ]; then
            ARGS+=(--only "${INPUT_PIPELINES}")
          fi
          if [ "${INPUT_FORCE:-false}" = "true" ]; then
            ARGS+=(--force)
          fi
          python pipeline/fetch_zenodo.py --list-pipelines-needing-run "${ARGS[@]}"

  run:
    name: Run ${{ matrix.pipeline }}
    needs: check
    if: needs.check.outputs.pipelines != '' && needs.check.outputs.pipelines != '[]'
    # NB: change the label to whichever Larger Runner is enabled in your org.
    # See https://docs.github.com/en/actions/using-github-hosted-runners/about-larger-runners
    runs-on: ubuntu-latest-32-cores
    container:
      image: ghcr.io/ukbol/mind-the-gap:latest
    timeout-minutes: 360
    strategy:
      # Strictly serial: only one Larger Runner billable at a time, and
      # producer pipelines must finish before their consumers start.
      max-parallel: 1
      fail-fast: false
      matrix:
        pipeline: ${{ fromJson(needs.check.outputs.pipelines) }}
    env:
      DATA_DIR: ${{ github.workspace }}/data
      OUT_DIR: ${{ github.workspace }}/final_result
    steps:
      - uses: actions/checkout@v4
        with:
          # Pick up state.json updates from earlier matrix legs.
          ref: ${{ github.ref }}

      - name: Pull latest state from this branch
        run: |
          git fetch origin "${GITHUB_REF_NAME}" --depth=1 || true
          git reset --hard "origin/${GITHUB_REF_NAME}" || true

      - name: Fetch inputs from Zenodo
        run: python pipeline/fetch_zenodo.py --pipeline "${{ matrix.pipeline }}" --data-dir "$DATA_DIR"

      - name: Run pipeline
        run: python pipeline/run.py --pipeline "${{ matrix.pipeline }}" --data-dir "$DATA_DIR" --out-dir "$OUT_DIR"

      - name: Upload results as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.pipeline }}
          path: ${{ env.OUT_DIR }}/${{ matrix.pipeline }}
          if-no-files-found: warn
          retention-days: 30

      - name: Publish results to Zenodo
        if: success()
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: python pipeline/publish_zenodo.py --pipeline "${{ matrix.pipeline }}" --out-dir "$OUT_DIR"

      - name: Commit refreshed state.json
        if: success()
        env:
          PIPELINE: ${{ matrix.pipeline }}
        run: |
          if git diff --quiet pipeline/state.json; then
            echo "state.json unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "mind-the-gap-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/state.json
          git commit -m "ci: bump state.json for pipeline ${PIPELINE}"
          for attempt in 1 2 3 4; do
            # Pull --rebase to integrate any earlier matrix-leg pushes.
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push -u origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((2 ** attempt))
          done
          echo "::warning::failed to push state.json after retries"
