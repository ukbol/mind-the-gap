name: Build runtime container

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "requirements.txt"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mind-the-gap:latest
            ghcr.io/${{ github.repository_owner }}/mind-the-gap:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
